[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-shot-analysis-ai"
version = "0.3.0"
description = "Open-source tennis shot analysis demo with synthetic and optional MediaPipe workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Open Source Maintainer" }
]
keywords = ["computer-vision", "tennis", "mediapipe", "pose-estimation", "data-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
video = [
  "mediapipe>=0.10.21,<2",
]
dev = [
  "pytest>=8.0",
]
release = [
  "build>=1.2",
]

[project.scripts]
tennis-shot-demo = "tennis_shot_analysis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
