[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-shot-analysis-ai"
version = "0.4.0"
description = "Reproducible 2D tennis motion proxy analysis from synthetic, CSV, and optional video landmarks"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Open Source Maintainer" }
]
keywords = ["computer-vision", "tennis", "mediapipe", "pose-estimation", "data-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/frankwyf/tennis-shot-analysis-ai"
Documentation = "https://github.com/frankwyf/tennis-shot-analysis-ai#readme"
Issues = "https://github.com/frankwyf/tennis-shot-analysis-ai/issues"
Changelog = "https://github.com/frankwyf/tennis-shot-analysis-ai/blob/master/CHANGELOG.md"

[project.optional-dependencies]
video = [
  "mediapipe>=0.10.21,<2",
]
dev = [
  "pytest>=8.0",
]
release = [
  "build>=1.2",
]

[project.scripts]
tennis-shot-demo = "tennis_shot_analysis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
