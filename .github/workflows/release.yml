name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate and build release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate version and reviewed branch ancestry
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_NAME" != v* || "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME must match pyproject.toml version $PROJECT_VERSION (prefixed with v)." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Install package and release tooling
        run: |
          python -m pip install -e ".[dev,release]"
          python -m pip check
      - name: Run test suite and headless synthetic demo
        run: |
          python -m pytest
          python -m tennis_shot_analysis --no-plot --save-summary artifacts/summary.json
      - name: Build source and wheel distributions
        run: python -m build --outdir dist
      - name: Verify installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-verify"
          "$RUNNER_TEMP/wheel-verify/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-verify/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-verify/bin/python" scripts/check_distribution.py --expected-version "${GITHUB_REF_NAME#v}" --work-dir "$RUNNER_TEMP/wheel-smoke"
      - name: Generate distribution checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub release
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist
      - name: Verify checksums before publishing
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Create release with generated notes and verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
