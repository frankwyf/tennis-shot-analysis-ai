name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}${{ matrix.minimum && ' (minimum dependencies)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.10"
            minimum: true
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core and test dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.minimum }}" == "true" ]]; then
            python -m pip install -e ".[dev]" -c constraints/minimum-py310.txt
          else
            python -m pip install -e ".[dev]"
          fi
          python -m pip check
      - name: Run test suite
        run: python -m pytest --junitxml=artifacts/test-results.xml
      - name: Run synthetic batch CLI
        run: python -m tennis_shot_analysis --no-plot --save-summary artifacts/summary.json --save-landmarks artifacts/landmarks.csv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.minimum || 'current' }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore

  distribution:
    name: Build and verify installed distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tooling and check core requirements isolation
        run: |
          python -m pip install -e ".[release]"
          python -m pip install --dry-run --no-index --no-build-isolation -r requirements.txt
          python -m pip check
      - name: Build wheel and source distribution
        run: python -m build --outdir dist
      - name: Verify wheel in a clean environment away from source
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-verify"
          "$RUNNER_TEMP/wheel-verify/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-verify/bin/python" -m pip check
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          "$RUNNER_TEMP/wheel-verify/bin/python" scripts/check_distribution.py --expected-version "$VERSION" --work-dir "$RUNNER_TEMP/wheel-smoke"

  video-smoke:
    name: Optional video stack on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install optional video stack and check Tasks imports
        run: |
          python -m pip install -e ".[dev,video]"
          python -m pip check
          python -c "import cv2, mediapipe; from mediapipe.tasks.python import vision; print('OpenCV', cv2.__version__, 'MediaPipe', mediapipe.__version__, vision.RunningMode.VIDEO)"
      - name: Check generated video with fake inference (no model download)
        run: python -m pytest tests/test_video.py tests/test_video_runtime.py -rs
